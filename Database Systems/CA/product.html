<!DOCTYPE html>
<html>

        <title>Add Record to Product</title>

        <meta charset="UTF-8">

         
    </head>

    <body>
        <h1>Tech Supply</h1> 
		
		<h2>Add a Record to Product</h2>

        <label class="title">Product ID</label>
        <form action="add_record_product.php" method='post'>
            <input type='submit' value='Add Record' name='productID' />
            <input type="text" name="productID" size="40" placeholder = "Enter the Product ID" required />     
        </form>
		
        <label class="title">Product Name</label>
        <form action="add_record_product.php" method='post'>
            <input type='submit' value='Add Record' name='productName' />
            <input type="text" name="productName" size="40" placeholder = "Enter the product Name" required />     
        </form>
        
        <label class="title">Product Price</label>
        <form action="add_record_product.php" method='post'>
            <input type='submit' value='Add Record' name='productPrice' />
            <input type="text" name="productPrice" size="40" placeholder = "Enter the product Price" required />     
        </form>

        <label class="title">Product Quantity in Stock</label>
        <form action="add_record_product.php" method='post'>
            <input type='submit' value='Add Record' name='QuantityinStock' />
            <input type="text" name="QuantityinStock" size="40" placeholder = "Enter the product Quantity in Stock" required />     
        </form>

        <label class="title">Supplier ID</label>
        <form action="add_record_product.php" method='post'>
            <input type='submit' value='Add Record' name='supplierID' />
            <input type="text" name="supplierID" size="40" placeholder = "Enter the Supplier ID" required />     
        </form>


        <input type="button" onclick="window.location.href = 'index.html'" value="Home" />
    </body>
