<html>
<head>
    <title>Graph of AAPL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #charts {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            max-width: 1100px;
            max-height: 300px;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Price and Volume Graphs</h1>
    <ul>Overall Maximum Price: {{ highest_price }}, Overall Minimum Price: {{ lowest_price }}</ul>
    <ul>Latest Average Price: {{ last_price }}, Latest Volume Sold: {{ last_volume }}</ul>
    <div id="charts">
        <canvas id="myChart"></canvas>
        <canvas id="volumeChart"></canvas>
    </div>

    <script>
        let priceChart, volumeChart;

        function drawPriceChart(aggregated_data) {
            let labels = aggregated_data.map(item => item.time);
            let range = aggregated_data.map(item => [item.min_price, item.max_price]);
            let average_prices = aggregated_data.map(item => item.average_price);

            let ctx = document.getElementById('myChart').getContext('2d');
            if (priceChart) priceChart.destroy();
            priceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Price Range',
                        data: range,
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1,
                        fill: true
                    },{
                        label: 'Average Price',
                        data: average_prices,
                        type: 'line',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            min: 200,
                            max: 400,
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function drawVolumeChart(aggregated_data) {
            let labels = aggregated_data.map(item => item.time);
            let volume = aggregated_data.map(item => item.volume);

            let ctx = document.getElementById('volumeChart').getContext('2d');
            if (volumeChart) volumeChart.destroy();
            volumeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Volume Sold',
                        data: volume,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateStats(aggregated_data) {
            const highest_price = Math.max(...aggregated_data.map(item => item.max_price));
            const lowest_price = Math.min(...aggregated_data.map(item => item.min_price));
            const last_data = aggregated_data[aggregated_data.length - 1];
            const last_price = last_data.average_price;
            const last_volume = last_data.volume;
        }

        function fetchData() {
            $.getJSON('/data', function(aggregated_data) {
                drawPriceChart(aggregated_data);
                drawVolumeChart(aggregated_data);
                updateStats(aggregated_data);
            });
        }

        setInterval(fetchData, 5000);
        fetchData();
    </script>
</body>
</html>
