<html>
<head>
    <title>Job Counts by Company</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Job Counts by Company</h1>
    <table>
        <thead>
            <tr>
                <th>Company</th>
                <th>Job Count</th>
            </tr>
        </thead>
        <tbody>
            {% for company, count in company_counts.items() %}
            <tr>
                <td>{{ company }}</td>
                <td>{{ count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
